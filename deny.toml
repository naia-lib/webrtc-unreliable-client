# cargo-deny configuration for webrtc-unreliable-client.
#
# Policy (2026-08-27): keep this tree advisory-clean so downstream naia never
# inherits findings from here. No ignore entries — fix forward instead.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0", # webpki-roots
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tests/loopback.rs consumes naia-server-socket from naia dev.
allow-git = ["https://github.com/naia-lib/naia"]
